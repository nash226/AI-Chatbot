[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "openai>=2.29.0",
    "python-dotenv>=1.2.2",
    "tiktoken (>=0.12.0,<0.13.0)",
    "docling (>=2.81.0,<3.0.0)",
    "pinecone (>=8.1.0,<9.0.0)",
]

[tool.setuptools]
py-modules = ["chatbot", "main"]
